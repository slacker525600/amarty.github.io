    640,400],

    70,60

    95,60

  [ -10, 195, // gingerbread house 
    130,115
  ],

    225,200
  ],

  [ 500, 25, // stars
    110,55
  ],
  [ 300, 45, // moosesleigh
    200,80
  ],
  [ 500, 75, // snowflakes
    110,100
  ],
  [ 300, 125, // menhora
    200,75
  ],
  [ 475, 170, // candycanes
    160,150

  [ 305, 205, // snowman
    155, 175

  [ 430, 325,
    60,35

  [ 450, 325,

  [ 470, 325,

  [ 500, 325,
    50, 40
  ],
  [ 520, 325,
    60, 40
  ],
  [ 550, 325,
    60, 40
  ],
  [ 580, 325,
    60, 40
  ],
  [ 580, 350,
    60, 40
  ],
  [ 0,  0, // full
    640,400],

];
var curLoc = 0;
function setSvgView(coords){
  var x = coords[0];
  var y = coords[1];
  var rx = coords[2];
  var ry = coords[3];
  var coordString = `${x} ${y} ${rx} ${ry}`;

  var svg = document.getElementById('mainSvg');
  
  const animator = svg.querySelector('animate');
  
  var fromString = animator.getAttribute('to');
  if(fromString) animator.setAttribute('from', fromString); 

  animator.setAttribute('to', coordString); 
  animator.beginElement(); 

}

function leftarrow(){
  curLoc = curLoc > 0 ? curLoc - 1 : curLoc;
  setSvgView(coordArray[curLoc%coordArray.length]);
}

function rightarrow(){
  curLoc = curLoc + 1;
  setSvgView(coordArray[curLoc%coordArray.length]);
}

function enableGlow(){
  var blurEffect = document.getElementById('blurEffect');
  blurEffect.setAttribute('stdDeviation', '6');

  var svgAnimator = document.getElementById('glowAnimate');
  svgAnimator.setAttribute('values', '0; 10; 0');
  svgAnimator.beginElement(); 
}

function disableGlow(){
  var blurEffect = document.getElementById('blurEffect');
  blurEffect.setAttribute('stdDeviation', '0');

  var svgAnimator = document.getElementById('glowAnimate');
  svgAnimator.setAttribute('values', '0; 0; 0');
  svgAnimator.beginElement(); 

}

 </script>
 
  <style>
   html,
   body{ 
     height:100%;
    }
   body{
     background:#000;
     display:block; 
     align-items:left;
     justify-content:left;
     font-family:Arial,Helvetica,sans-serif
   }
  text {
    filter: url(#glow);
  }


 </style>

<body>
  <!-- define the whole html to be an svg -->
  <svg id="mainSvg" viewBox="0 0 640 400" preserveAspectRatio="none" style="width:640px;height:400px" >
    <animate attributeName="viewBox" dur="0.5s" fill="freeze" restart="always" />

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <!-- Blur the line -->
    <!-- I want each text selector to get a glow in and out effect, that can be stopped -->
      <feGaussianBlur id="blurEffect" stdDeviation="6" result="blur" >
        <animate 
          id="glowAnimate"
          attributeName="stdDeviation" 
          values="0; 10; 0" 
          dur="3s" 
          repeatCount="indefinite" />
      </feGaussianBlur>

      
      <!-- Merge the blurred glow and the original source graphic -->
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="text" />
      </feMerge>
    </filter>
